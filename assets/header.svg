<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Hi, I'm AliAkbar Isapour — Aspiring Data Scientist" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="0.5" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
  </defs>

  <!-- back wave (cyan, gently moving) -->
  <path d="M-100 0 H1300 V182 C1150 232 1000 142 850 182 C700 222 550 142 400 182 C250 222 110 162 -100 182 Z" fill="#00E5FF" fill-opacity="0.16">
    <animateTransform attributeName="transform" type="translate" values="0 0; -60 0; 0 0" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- main wave -->
  <path d="M0 0 H1200 V160 C1050 210 900 120 750 160 C600 200 450 120 300 160 C150 200 60 140 0 160 Z" fill="url(#bg)"/>

  <!-- title -->
  <text x="600" y="100" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="52" font-weight="700" fill="#00E5FF" stroke="#8A2BE2" stroke-width="1" opacity="0">
    Hi, I'm AliAkbar Isapour &#128075;
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- subtitle -->
  <text x="600" y="138" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" opacity="0">
    Aspiring Data Scientist
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
