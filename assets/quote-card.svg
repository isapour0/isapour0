<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" role="img" aria-label="The future depends on some graduate student who is deeply suspicious of everything I have said. — Geoffrey Hinton" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="0.5" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="20" y="20" width="820" height="190" rx="18"/>
    </clipPath>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#00d4ff" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="20" y="20" width="820" height="190" rx="18" fill="url(#bg)" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>

  <!-- left accent bar (cyan) -->
  <g clip-path="url(#card)">
    <rect x="20" y="20" width="8" height="190" fill="#00E5FF"/>
  </g>

  <!-- big decorative quote mark (purple) -->
  <text x="52" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#8A2BE2" fill-opacity="0.55">&#8220;</text>

  <!-- quote text -->
  <text font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff">
    <tspan x="110" y="84">The future depends on some graduate student</tspan>
    <tspan x="110" y="120">who is deeply suspicious of everything I have said.</tspan>
  </text>

  <!-- divider -->
  <line x1="110" y1="146" x2="190" y2="146" stroke="#8A2BE2" stroke-width="2" stroke-linecap="round"/>

  <!-- author -->
  <text x="110" y="178" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#00E5FF">&#8212; Geoffrey Hinton</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
