<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="0.5" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
  </defs>

  <!-- back wave (cyan, gently moving) -->
  <path d="M-100 100 V28 C50 -12 200 68 350 28 C500 -12 650 68 800 28 C950 -12 1100 68 1300 28 V100 Z" fill="#00E5FF" fill-opacity="0.16">
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- main wave -->
  <path d="M0 100 V40 C150 0 300 80 450 40 C600 0 750 80 900 40 C1050 0 1150 60 1200 40 V100 Z" fill="url(#bg)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
